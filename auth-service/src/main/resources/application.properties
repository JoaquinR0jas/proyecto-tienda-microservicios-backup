# Nombre con el que se registra en Eureka
spring.application.name=auth-service
server.port=8091

# Sin base de datos propia: los usuarios se consultan en ms-usuarios via Feign

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Clave secreta para firmar los JWT (debe ser larga y compleja)
jwt.secret=clave-super-secreta-latienda-2024-djtienda-microservicios
# Tiempo de expiración del token en milisegundos (86400000 = 24 horas)
jwt.expiration=3600000