server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/auth/v3/api-docs, /v3/api-docs

        - id: ms-usuarios
          uri: lb://MS-USUARIOS
          predicates:
            - Path=/api/v1/usuarios/**
          filters:
            - RewritePath=/api/v1/usuarios/v3/api-docs, /v3/api-docs

        - id: ms-catalogo
          uri: lb://MS-CATALOGO
          predicates:
            - Path=/api/v1/catalogo/**
          filters:
            - RewritePath=/api/v1/catalogo/v3/api-docs, /v3/api-docs

        - id: ms-pedidos
          uri: lb://MS-PEDIDOS
          predicates:
            - Path=/api/v1/pedidos/**
          filters:
            - RewritePath=/api/v1/pedidos/v3/api-docs, /v3/api-docs

        - id: ms-pagos
          uri: lb://MS-PAGOS
          predicates:
            - Path=/api/v1/pagos/**
          filters:
            - RewritePath=/api/v1/pagos/v3/api-docs, /v3/api-docs

        - id: ms-contenido
          uri: lb://MS-CONTENIDO
          predicates:
            - Path=/api/v1/contenido/**
          filters:
            - RewritePath=/api/v1/contenido/v3/api-docs, /v3/api-docs

      # configuracion CORS para que la pagina web (frontend) pueda
      # conectarse al backend desde el navegador sin problemas
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"   # frontend-react (npm run dev)
              - "http://127.0.0.1:5173"
              - "http://localhost:4173"   # frontend-react (npm run preview)
              - "http://localhost:5500"
              - "http://127.0.0.1:5500"
              - "http://localhost:3000"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /api/v1/auth/v3/api-docs
      - name: ms-usuarios
        url: /api/v1/usuarios/v3/api-docs
      - name: ms-catalogo
        url: /api/v1/catalogo/v3/api-docs
      - name: ms-pedidos
        url: /api/v1/pedidos/v3/api-docs
      - name: ms-pagos
        url: /api/v1/pagos/v3/api-docs
      - name: ms-contenido
        url: /api/v1/contenido/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# La misma clave secreta que usa auth-service para firmar los tokens.
# El gateway la necesita para poder verificar la firma.
jwt:
  secret: clave-super-secreta-latienda-2024-djtienda-microservicios

