      "spring.datasource.url": "jdbc:mysql://mysql:3306/ms_catalogo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      "spring.datasource.username": "root"
      "spring.datasource.password": ""
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 256M

